name: Update master blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-blocklist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Download, normalize and deduplicate
        shell: python
        run: |
          import ipaddress
          import re
          import time
          import urllib.request
          from pathlib import Path

          sources = {
              "StevenBlack": "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
              "YouTube": "https://raw.githubusercontent.com/kboghdady/youTube_ads_4_pi-hole/master/crowed_list.txt",
              "Optimized": "https://media.githubusercontent.com/media/zachlagden/Pi-hole-Optimized-Blocklists/main/lists/all_domains.txt",
              "HaGeZi Pro": "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt",
              "KADhosts": "https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt",
              "Developer Dan": "https://www.github.developerdan.com/hosts/lists/ads-and-tracking-extended.txt",
          }

          def is_ip(value):
              try:
                  ipaddress.ip_address(value)
                  return True
              except ValueError:
                  return False

          def normalize(value):
              value = value.lower().rstrip(".")
              if value == "localhost.localdomain":
                  return None
              if "." not in value or is_ip(value):
                  return None
              try:
                  value = value.encode("idna").decode("ascii")
              except UnicodeError:
                  return None
              if len(value) > 253:
                  return None
              if not all(
                  1 <= len(label) <= 63
                  and re.fullmatch(r"[a-z0-9_-]+", label)
                  for label in value.split(".")
              ):
                  return None
              return value

          domains = set()

          for name, url in sources.items():
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url, headers={"User-Agent": "Pi-hole-list-builder"}
                      )
                      with urllib.request.urlopen(request, timeout=180) as response:
                          text = response.read().decode("utf-8-sig")
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)

              current = set()
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith(("#", "!", "[")):
                      continue
                  line = line.split("#", 1)[0].strip()
                  fields = line.split()
                  if not fields:
                      continue

                  if is_ip(fields[0]):
                      if fields[0] not in ("0.0.0.0", "127.0.0.1"):
                          continue
                      candidates = fields[1:]
                  else:
                      match = re.fullmatch(r"\|\|([^^]+)\^", line)
                      candidates = [match.group(1) if match else line]

                  for candidate in candidates:
                      domain = normalize(candidate)
                      if domain:
                          current.add(domain)

              if len(current) < 1000:
                  raise RuntimeError(
                      f"{name}: suspiciously small download; keeping old list"
                  )

              print(f"{name}: {len(current):,} unique domains")
              domains.update(current)

          target = Path("master_unique_domains.txt")
          if target.exists():
              with target.open() as existing:
                  previous_count = sum(1 for _ in existing)
              if len(domains) < previous_count * 0.8:
                  raise RuntimeError(
                      "Domain count dropped over 20%; keeping old list"
                  )

          output = "\n".join(sorted(domains)) + "\n"
          if len(output.encode()) >= 95 * 1024 * 1024:
              raise RuntimeError("List is approaching GitHub's file-size limit")

          temporary = Path("master_unique_domains.txt.tmp")
          temporary.write_text(output, encoding="utf-8")
          temporary.replace(target)
          print(f"Master list: {len(domains):,} unique domains")

      - name: Publish updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_unique_domains.txt
          if git diff --cached --quiet; then
            echo "List unchanged"
          else
            git commit -m "Update master blocklist"
            git push
          fi
